<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Traffic-Stats</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-main">
          <img src="../icons/icon48.png" alt="" class="logo" width="28" height="28" />
          <h1>Traffic-Stats</h1>
        </div>
        <button id="optionsBtn" class="opts-btn" type="button" title="Open provider settings">
          <span class="opts-btn__glyph" aria-hidden="true">⚙</span>
          Options
        </button>
      </header>
      <hr class="header-divider" />

      <form id="analyzeForm" class="input-row" autocomplete="off">
        <input
          id="domainInput"
          type="text"
          inputmode="url"
          spellcheck="false"
          autocapitalize="none"
          placeholder="example.com or https://example.com/…"
          aria-label="Domain to analyze"
          required
        />
        <button id="analyzeBtn" type="submit">
          <span class="btn-label">Analyze</span>
        </button>
      </form>

      <div id="historyRow" class="history hidden" aria-label="Recent lookups">
        <span class="history__label">Recent</span>
        <div id="historyChips" class="history__chips"></div>
        <button id="clearHistoryBtn" class="history__clear" type="button" title="Clear recent lookups">Clear</button>
      </div>

      <p id="formError" class="form-error hidden" role="alert"></p>

      <section id="results" class="card hidden" aria-live="polite">
        <div class="result-header">
          <div class="result-status">
            <span id="statusDomain" class="result-status__domain"></span>
            <span id="statusMeta" class="result-status__meta"></span>
          </div>
          <span id="sourceBadge" class="badge"></span>
        </div>

        <div class="grid">
          <div class="panel panel--visits">
            <h2>Estimated Visits</h2>
            <div class="visits-value">
              <div id="visits" class="big">—</div>
              <div id="visitMonth" class="visits-month"></div>
            </div>
            <div id="visitDelta" class="delta hidden"></div>
            <svg id="sparkline" class="sparkline hidden" role="img" aria-label="Monthly visits trend" preserveAspectRatio="none" viewBox="0 0 120 36"></svg>
            <button id="similarwebLink" class="link-btn" type="button">View full report on Similarweb ↗</button>
          </div>
          <div class="panel">
            <h2>Top Countries</h2>
            <ul id="countries"></ul>
          </div>
        </div>

        <div id="errorBox" class="error-box hidden">
          <button id="errorToggle" class="error-box__toggle" type="button" aria-expanded="false" aria-controls="errorDetails">
            Provider reported an issue — show details
          </button>
          <pre id="errorDetails" class="error-box__details hidden"></pre>
        </div>

        <div class="result-actions">
          <button id="refreshBtn" class="ghost-btn" type="button" title="Bypass cache and re-query the provider">
            <span aria-hidden="true">↻</span>
            Refresh
          </button>
          <span class="result-actions__spacer"></span>
          <button id="copyBtn" class="ghost-btn" type="button">Copy summary</button>
          <button id="exportBtn" class="ghost-btn" type="button">Export JSON</button>
        </div>
      </section>
    </div>

    <div class="oss-bar">
      <span class="oss-bar__text">Open-source project:</span>
      <a class="oss-bar__link" href="https://github.com/Chrome-Extensions-labs/web-traffic-analyzer" target="_blank" rel="noopener noreferrer">
        GitHub
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>

    <script src="./popup.js" type="module"></script>
  </body>
</html>
