<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traffic-Stats</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-main">
          <img src="../icons/icon128.png" alt="" class="logo" />
          <h1>Traffic-Stats</h1>
        </div>
        <button id="optionsBtn" class="opts-btn">⚙ Options</button>
      </header>
      <hr class="header-divider" />

      <section id="optionsPanel" class="options-panel hidden">
        <div class="options-grid">
          <div>
            <label for="baseUrl">Base URL</label>
            <input id="baseUrl" type="text" placeholder="https://similarweb12.p.rapidapi.com" />
          </div>
          <div>
            <label for="hostHeader">RapidAPI Host</label>
            <input id="hostHeader" type="text" placeholder="similarweb12.p.rapidapi.com" />
          </div>
          <div>
            <label for="epVisits">Visits endpoint</label>
            <input id="epVisits" type="text" placeholder="/v1/website/visits?domain=" />
          </div>
          <div>
            <label for="epGeo">Top Countries endpoint</label>
            <input id="epGeo" type="text" placeholder="/v1/website/top-countries?domain=" />
          </div>
          <div>
            <label for="apiKey">RapidAPI Key</label>
            <input id="apiKey" type="text" placeholder="Your X-RapidAPI-Key" />
          </div>
        </div>
        <label class="switch" for="useMock">
          <input id="useMock" type="checkbox" />
          <span>Switch Demo Mode</span>
        </label>
        <div class="options-actions">
          <span id="saveStatus" class="save-status" aria-live="polite"></span>
          <button class="save-btn" id="saveBtn">Save</button>
        </div>
      </section>

      <div class="input-row">
        <input id="domainInput" type="text" placeholder="Enter domain e.g. example.com or URL" />
        <button id="analyzeBtn">Analyze</button>
      </div>

      <section id="results" class="card hidden">
        <div id="status"></div>
        <div class="grid">
          <div class="panel">
            <h2>Estimated Visits</h2>
            <div id="visits"></div>
          </div>
          <div class="panel">
            <h2>Top Countries</h2>
            <ul id="countries"></ul>
          </div>
        </div>
      </section>
    </div>

    <div class="oss-bar">
      <span class="oss-bar__text">Open-source project:</span>
      <a class="oss-bar__link" href="https://github.com/Chrome-Extensions-labs/web-traffic-analyzer" target="_blank" rel="noopener noreferrer">
        GitHub
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>

    <script src="./popup.js" type="module"></script>
  </body>
</html>
